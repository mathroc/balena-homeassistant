version: "2.1"

services:
  # https://hub.docker.com/r/homeassistant/home-assistant
  homeassistant:
    image: homeassistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
    volumes:
      - config:/config
    ports:
      - "80:8123"
    labels:
      # Required for Bluetooth via D-Bus
      io.balena.features.dbus: "1"
    environment:
      # Required for Bluetooth via D-Bus
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
    cap_add:
      - NET_ADMIN # https://www.home-assistant.io/integrations/bluetooth/#additional-details-for-container
      - NET_RAW # https://www.home-assistant.io/integrations/bluetooth/#additional-details-for-container
    extra_hosts:
      # To access the matter-server using the host network
      - "host.docker.internal:host-gateway"

  # https://hub.docker.com/_/eclipse-mosquitto
  mqtt:
    build: mqtt
    ports:
      - 1883:1883
    volumes:
      - mqtt:/mosquitto/data
    tmpfs:
      - /mosquitto/log

  # https://esphome.io/guides/getting_started_command_line.html#installation
  esphome:
    image: ghcr.io/esphome/esphome:2026.11.0@sha256:6351ae811202064bb3eb49dde982609b47acd523103a66d7b9c5c1431beea055
    volumes:
      - esphome:/config
    privileged: true

  # https://www.zigbee2mqtt.io/guide/getting-started/#installation
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    volumes:
      - zigbee2mqtt:/app/data
    environment:
      ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_HOST: 0.0.0.0
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: 8080
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mqtt:1883
    ports:
      - 8080:8080
    privileged: true
    devices:
      - /dev/ttyAMA0
      - /dev/ttyS0
      - /dev/serial0
      - /dev/serial1

  # https://hub.docker.com/r/codercom/code-server
  code-server:
    image: codercom/code-server:4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
    command:
      - --port=9000
      - --auth=none
      - --extensions-dir=/config/.vscode
      - --user-data-dir=/config/.vscode
      - /config
    working_dir: /config
    ports:
      - 9000:9000/tcp
    volumes:
      - config:/config
      - zigbee2mqtt:/zigbee2mqtt
      - esphome:/esphome
    user: root

  # https://github.com/balenablocks/hostname
  hostname:
    build: hostname
    restart: no
    labels:
      io.balena.features.supervisor-api: 1
    environment:
      SET_HOSTNAME: homeassistant

  # https://github.com/home-assistant-libs/python-matter-server/blob/main/docs/docker.md
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    # Required for mDNS to work correctly
    network_mode: host
    security_opt:
      # Required for Bluetooth via D-Bus
      - apparmor:unconfined
    volumes:
      - matter-server:/data/
    environment:
      # Required for Bluetooth via D-Bus
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
    labels:
      # Required for Bluetooth via D-Bus
      io.balena.features.dbus: '1'
    # If you adjust command line, make sure to pass the default CMD arguments too:
    # command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0

volumes:
  config: {}
  mqtt: {}
  zigbee2mqtt: {}
  esphome: {}
  matter-server: {}
